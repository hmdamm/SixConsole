name: Bug Report
description: Create a report to help us fix an issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug in Six Console!
  - type: input
    id: version
    attributes:
      label: Six Console Version
      description: What version of Six Console are you running? (e.g. 1.0.0)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Windows OS Build
      description: e.g. Windows 11 Pro Build 26100
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Select operator '...'
        2. Select weapon '...'
        3. Press Middle Mouse Button
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Diagnostic Logs
      description: Contents of %LOCALAPPDATA%\SixConsole\log.txt (if relevant).
