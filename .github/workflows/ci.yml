name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore Dependencies
        run: dotnet restore SixConsole.slnx

      - name: Build Solution
        run: dotnet build SixConsole.slnx --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test src/SixConsole.Tests/SixConsole.Tests.csproj --configuration Release --no-build --verbosity normal
